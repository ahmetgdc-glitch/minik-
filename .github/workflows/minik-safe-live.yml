name: Deploy current MINIK safe live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current MINIK source
        uses: actions/checkout@v4
        with:
          repository: ahmetgdc-glitch/Minik-beta
          ref: main
          path: app

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Disable PWA registration on Safari-safe mirror
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          old = 'registerOffline();'
          new = 'if (import.meta.env.VITE_DISABLE_PWA !== "1") registerOffline();'
          if old not in s:
              raise SystemExit('registerOffline() call not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build current MINIK
        working-directory: app
        env:
          VITE_DISABLE_PWA: "1"
        run: npm run build

      - name: Remove service worker from safe mirror
        working-directory: app
        run: rm -f dist/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
